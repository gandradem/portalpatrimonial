      if(gs.length){ var tg = mkTable(['Meta','Monto','Año','Prioridad'], [1,2]); gs.forEach(function(g){ tg.add([g.n, num(g.m) > 0 ? mx(num(g.m)) : '—', g.y || '—', g.i || '—']); }); pm.appendChild(tg.wrap); } else pm.appendChild(el('p', 'empty', 'Sin metas capturadas.'));
      var pq = S0.risk.q10 ? RISK[9].o[S0.risk.q10 - 1] : null; if(pq) pm.appendChild(el('p', 'hint', 'Prioridad principal: ' + pq));
      cols2.appendChild(pr); cols2.appendChild(pm); body.appendChild(cols2);
    }
    if(r.invite){
      var pnn = el('div', 'panel'); pnn.appendChild(el('h3', null, 'Tus notas')); var f = el('div', 'f'); var ta2 = el('textarea'); ta2.rows = 5; ta2.setAttribute('aria-label', 'Notas del asesor'); ta2.placeholder = 'Observaciones para la sesión 2, pendientes, acuerdos…';
      ta2.value = draft.notes[r.key] != null ? draft.notes[r.key] : (r.invite.notes || ''); ta2.addEventListener('input', function(){ draft.notes[r.key] = ta2.value; }); f.appendChild(ta2); pnn.appendChild(f);
      var ar = el('div', 'actions'); ar.style.marginTop = '12px'; var sv = el('button', 'btn primary', 'Guardar notas'); sv.type = 'button';
      sv.addEventListener('click', function(){ db.doc('invites/' + r.key).update({notes:ta2.value}).then(function(){ delete draft.notes[r.key]; say('Notas guardadas.'); }, function(){ say('No se pudieron guardar.'); }); });
      var del = el('button', 'btn danger', 'Eliminar cliente'); del.type = 'button'; var dt = null;
      del.addEventListener('click', function(){
        if(!dt){ del.textContent = '¿Seguro? Toca otra vez'; dt = setTimeout(function(){ dt = null; del.textContent = 'Eliminar cliente'; }, 4000); return; }
        clearTimeout(dt); var ops = [db.doc('invites/' + r.key).delete()]; if(r.sub) ops.push(db.doc('submissions/' + r.sub.uid).delete());
        Promise.all(ops).then(function(){ tab = 'clientes'; say('Cliente eliminado.'); renderAdmin(); }, function(){ say('No se pudo eliminar.'); });
      });
      ar.appendChild(sv); ar.appendChild(del); pnn.appendChild(ar);
      if(!r.sub){ var tn1 = el('p', 'toast'); tn1.id = 'toast'; pnn.appendChild(tn1); }
      body.appendChild(pnn);
    }
  }

  function startTest(){
    S = emptyState(); lsKey = 'patrimonio-prueba'; persist = false; meta = {};
    var l = lsLoad(); if(l) S = l;
    var root = $('root'), body = chrome(root); var host = el('div'); host.style.cssText = 'max-width:780px;margin:0 auto'; body.appendChild(host);
    mountForm({persist:false, host:host, eyebrow:'Vista previa del cliente', banner:'Modo prueba: así lo ve tu cliente. Nada de lo que escribas aquí se envía ni aparece en tus reportes.'});
  }

  function startAdmin(){
    renderAdmin();
    db.collection('invites').onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ var v = d.data(); if(v && v.role !== 'admin') m[d.id] = v; }); invites = m; loaded.inv = true; if(tab !== 'probar' && !(modal && modal.busy)) renderAdmin();
    }, function(){ loaded.inv = true; });
    db.collection('submissions').onSnapshot(function(snap){
      subs = snap.docs.map(function(d){ var v = d.data() || {}; return {uid:d.id, code:v.code || '', status:v.status || 'borrador', createdAt:v.createdAt, submittedAt:v.submittedAt, updatedAt:v.updatedAt, name:v.name || '', survey:v.survey || null, data:normalize(v.data)}; });
      loaded.sub = true; if(tab !== 'probar' && tab !== 'correo' && !(modal && modal.busy)) renderAdmin();
    }, function(){ loaded.sub = true; });
    try{ db.doc('config/email').onSnapshot(function(snap){ if(snap && snap.exists){ var d = snap.data() || {}; cfg = {asesor:d.asesor || '', fecha:d.fecha || '', subject:d.subject || '', body:d.body || ''}; } }, function(){}); }catch(e){}
  }

  /* ================= datos: Supabase ================= */
  function pick(o, map){ var r = {}; Object.keys(map).forEach(function(k){ if(o && o[k] !== undefined) r[map[k]] = o[k]; }); return r; }
  function back(r, map){ var o = {}; Object.keys(map).forEach(function(k){ o[k] = r[map[k]] === undefined ? null : r[map[k]]; }); return o; }
  var M_INV = {code:'code', name:'name', email:'email', notes:'notes', createdAt:'created_at', invitedAt:'invited_at', invitedCount:'invited_count'};
  var M_SUB = {code:'code', status:'status', createdAt:'created_at', submittedAt:'submitted_at', updatedAt:'updated_at', name:'name', data:'data', progress:'progress', survey:'survey'};
  var TB = {
    invites:{pk:'code', to:function(o){ return pick(o, M_INV); }, from:function(r){ var o = back(r, M_INV); o.registered = !!r.user_id; o.role = r.role; return o; }},
    submissions:{pk:'user_id', to:function(o){ return pick(o, M_SUB); }, from:function(r){ return back(r, M_SUB); }},
    config:{pk:'key', to:function(o){ return {value:o}; }, from:function(r){ return r.value || {}; }}
  };
  var lis = [];
  function wrapErr(e){ return {code:(e && (e.code || e.status)) || 'error', message:(e && e.message) || ''}; }
  function fetchRows(t){ return sb.from(t).select('*').then(function(r){ if(r.error) throw wrapErr(r.error); return r.data || []; }); }
  function snapOf(t, rows){ var d = TB[t]; return {docs: rows.map(function(r){ return {id:r[d.pk], data:function(){ return d.from(r); }}; })}; }
  function refreshAll(){ lis.forEach(function(l){ l.run(); }); }
  var dbShim = {
    doc:function(path){
      var i = path.indexOf('/'), t = path.slice(0, i), id = path.slice(i + 1), d = TB[t];
      function done(r){ if(r.error) throw wrapErr(r.error); setTimeout(refreshAll, 50); }
      return {
        get:function(){ return sb.from(t).select('*').eq(d.pk, id).maybeSingle().then(function(r){ if(r.error) throw wrapErr(r.error); var row = r.data; return {exists:!!row, data:function(){ return row ? d.from(row) : undefined; }}; }); },
        set:function(v){ var row = d.to(v); row[d.pk] = id; return sb.from(t).upsert(row).then(done); },
        update:function(v){ return sb.from(t).update(d.to(v)).eq(d.pk, id).then(done); },
        'delete':function(){
          return sb.from(t).delete().eq(d.pk, id).then(function(r){ if(t !== 'invites') return r; return sb.from('profiles').delete().eq('code', id).then(function(){ return r; }); }).then(done);
        },
        onSnapshot:function(cb, errCb){
          var last = null; var l = {run:function(){ fetchRows(t).then(function(rows){ var key = JSON.stringify(rows); if(key === last) return; last = key; var row = rows.filter(function(r){ return r[d.pk] === id; })[0]; cb({exists:!!row, data:function(){ return row ? d.from(row) : undefined; }}); }, function(e){ if(errCb) errCb(e); }); }};
          lis.push(l); l.run(); return function(){ lis = lis.filter(function(x){ return x !== l; }); };
        }
      };
    },
    collection:function(t){
      return {onSnapshot:function(cb, errCb){
        var last = null; var l = {run:function(){ fetchRows(t).then(function(rows){ var key = JSON.stringify(rows); if(key === last) return; last = key; cb(snapOf(t, rows)); }, function(e){ if(errCb) errCb(e); }); }};
        lis.push(l); l.run(); return function(){ lis = lis.filter(function(x){ return x !== l; }); };
      }};
    }
  };
  dl = {save:function(o){
    try{
      var csv = /\.csv$/i.test(o.filename), blob = new Blob([(csv ? '﻿' : '') + o.data], {type: csv ? 'text/csv;charset=utf-8' : 'text/plain;charset=utf-8'});
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = o.filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500); return Promise.resolve();
    }catch(e){ return Promise.reject(e); }
  }};

  /* ================= arranque ================= */
  var started = false;
  function startSession(session){
    if(started) return; started = true; uid = session.user.id; db = dbShim;
    $('root').textContent = ''; $('root').appendChild(el('p', 'loading', 'Cargando…'));
    sb.from('profiles').select('*').eq('id', uid).maybeSingle().then(function(r){
      profile = r.data;
      if(r.error || !profile){ showNoInvite(); return; }
      isAdmin = profile.role === 'admin';
      if(isAdmin){ startAdmin(); setInterval(function(){ if(!document.hidden) refreshAll(); }, 15000); } else startClient();
    }, function(){ showNoInvite(); });
  }
  (function boot(){
    if(!window.supabase){ $('root').textContent = 'No se pudo cargar el portal. Recarga la página.'; return; }
    sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    var recovery = /type=recovery/.test(location.hash);
    sb.auth.onAuthStateChange(function(ev){ if(ev === 'PASSWORD_RECOVERY'){ setTimeout(function(){ started = true; showNewPass(); }, 0); } });
    sb.auth.getSession().then(function(r){
      var ses = r.data && r.data.session;
      if(recovery && ses){ started = true; showNewPass(); return; }
      if(ses) startSession(ses); else if(!recovery) showAuth('login');
    }, function(){ showAuth('login'); });
  })();
})();
</script>
